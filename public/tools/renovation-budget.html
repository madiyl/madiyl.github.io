<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>装修预算计算器 · 占位页</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .wrap { min-height: 100vh; display: grid; place-items: center; background: #f7f7f8; color: #0b0c0f; padding: 24px; }
      @media (prefers-color-scheme: dark) {
        .wrap { background: #0b0c0f; color: #f4f5f6; }
      }
      .card { width: min(680px, 100%); border-radius: 20px; background: rgba(255,255,255,0.7); border: 1px solid rgba(11,12,15,0.08); padding: 28px; backdrop-filter: blur(14px); }
      @media (prefers-color-scheme: dark) {
        .card { background: rgba(17, 19, 24, 0.7); border-color: rgba(244,245,246,0.10); }
      }
      h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.02em; }
      p { margin: 0; color: rgba(11,12,15,0.60); line-height: 1.6; }
      @media (prefers-color-scheme: dark) {
        p { color: rgba(244,245,246,0.72); }
      }
      a { display: inline-block; margin-top: 16px; color: #7aa2ff; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>装修预算计算器</h1>
        <p>这页是占位入口：预算分项与预警逻辑后续再接入。</p>
        <a href="../index.html">返回 Life &amp; Tools Hub</a>
      </div>
    </div>
  </body>
</html>
