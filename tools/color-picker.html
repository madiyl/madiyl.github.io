<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 颜色选择器 - Madiyl Tools</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .back-btn {
            background: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #333;
        }
        
        .back-btn:hover {
            background: #eee;
        }
        
        h1 {
            color: #333;
            font-size: 1.5em;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        
        .color-preview {
            width: 100%;
            height: 150px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: 600;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
        }
        
        .color-input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        
        input[type="color"] {
            width: 100%;
            height: 60px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 5px;
        }
        
        input[type="color"]::-webkit-color-swatch {
            border-radius: 8px;
            border: none;
        }
        
        .color-values {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .color-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .color-row label {
            width: 60px;
            font-size: 0.9em;
            margin: 0;
        }
        
        .color-row input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: monospace;
        }
        
        .color-row input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .color-row .copy-btn {
            padding: 12px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.2s;
        }
        
        .color-row .copy-btn:hover {
            background: #5a6fd6;
        }
        
        .color-row .copy-btn.copied {
            background: #4CAF50;
        }
        
        .random-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        
        .random-btn:hover {
            transform: scale(1.02);
        }
        
        .color-palette {
            margin-top: 20px;
        }
        
        .palette-title {
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }
        
        .palette-colors {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .palette-color {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .palette-color:hover {
            transform: scale(1.1);
            border-color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="../index.html" class="back-btn">← 返回</a>
            <h1>🎨 颜色选择器</h1>
        </header>
        
        <div class="card">
            <div class="color-preview" id="colorPreview">#667EEA</div>
            
            <div class="color-input-group">
                <label>选取颜色</label>
                <input type="color" id="colorPicker" value="#667EEA">
            </div>
            
            <div class="color-values">
                <div class="color-row">
                    <label>HEX</label>
                    <input type="text" id="hexValue" value="#667EEA" readonly>
                    <button class="copy-btn" onclick="copyToClipboard('hexValue', this)">复制</button>
                </div>
                <div class="color-row">
                    <label>RGB</label>
                    <input type="text" id="rgbValue" value="rgb(102, 126, 234)" readonly>
                    <button class="copy-btn" onclick="copyToClipboard('rgbValue', this)">复制</button>
                </div>
                <div class="color-row">
                    <label>HSL</label>
                    <input type="text" id="hslValue" value="hsl(229, 76%, 66%)" readonly>
                    <button class="copy-btn" onclick="copyToClipboard('hslValue', this)">复制</button>
                </div>
            </div>
            
            <button class="random-btn" onclick="randomColor()">🎲 随机颜色</button>
        </div>
        
        <div class="card color-palette">
            <div class="palette-title">预设配色</div>
            <div class="palette-colors" id="palette"></div>
        </div>
    </div>
    
    <script>
        const presetColors = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7',
            '#DDA0DD', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E9',
            '#F8B500', '#00CED1', '#FF69B4', '#32CD32', '#1E90FF',
            '#FF6347', '#9370DB', '#20B2AA', '#FFD700', '#6A5ACD'
        ];
        
        const colorPicker = document.getElementById('colorPicker');
        const colorPreview = document.getElementById('colorPreview');
        const hexValue = document.getElementById('hexValue');
        const rgbValue = document.getElementById('rgbValue');
        const hslValue = document.getElementById('hslValue');
        const palette = document.getElementById('palette');
        
        presetColors.forEach(color => {
            const div = document.createElement('div');
            div.className = 'palette-color';
            div.style.backgroundColor = color;
            div.onclick = () => setColor(color);
            palette.appendChild(div);
        });
        
        function setColor(hex) {
            const rgb = hexToRgb(hex);
            const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
            
            colorPicker.value = hex;
            colorPreview.style.backgroundColor = hex;
            colorPreview.textContent = hex.toUpperCase();
            
            hexValue.value = hex.toUpperCase();
            rgbValue.value = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
            hslValue.value = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
            
            colorPreview.style.color = hsl.l > 50 ? '#333' : '#fff';
            colorPreview.style.textShadow = hsl.l > 50 ? '1px 1px 3px rgba(0,0,0,0.2)' : '1px 1px 3px rgba(0,0,0,0.5)';
        }
        
        function randomColor() {
            const hex = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            setColor(hex);
        }
        
        function copyToClipboard(id, btn) {
            const text = document.getElementById(id).value;
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '已复制!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '复制';
                    btn.classList.remove('copied');
                }, 1500);
            });
        }
        
        colorPicker.addEventListener('input', (e) => setColor(e.target.value));
        
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }
        
        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    case b: h = ((r - g) / d + 4) / 6; break;
                }
            }
            return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
        }
    </script>
</body>
</html>
