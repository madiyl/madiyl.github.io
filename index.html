<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个极简高级的生活攻略与工具入口。" />
    <meta property="og:title" content="Life & Tools Hub" />
    <meta property="og:description" content="一个极简高级的生活攻略与工具入口。" />
    <meta property="og:type" content="website" />
    <meta name="x-build-sha" content="%VITE_BUILD_SHA%" />
    <title>Life & Tools Hub</title>
    <script>
      (() => {
        try {
          const t = localStorage.getItem('theme');
          const m = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (t === 'dark' || (!t && m)) document.documentElement.classList.add('dark');
        } catch {
        }
      })();
    </script>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="app-fallback" style="padding:16px;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto;line-height:1.6;color:#0a0a0a">
      页面正在加载中。如果长时间停留在空白页，请检查 GitHub Pages 是否已发布构建产物（dist），以及页面源码中是否仍引用 <code>/src/main.tsx</code>。
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
